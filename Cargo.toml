[package]
name = "rustmux"
version = "0.1.0"
edition = "2024"
description = "Rustmux human-reviewed implementation track"
license = "MIT"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
nix = { version = "0.31", features = ["fs", "term", "process", "poll", "signal", "user"] }
png = "0.18.1"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
unicode-width = { version = "0.2.2", default-features = false }
