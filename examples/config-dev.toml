# Development configuration for the Rustmux main-human review track.
# Native main-human configuration. Load this file with --config.
# Local config-dev.toml can replace config.toml after review.
# Ctrl-B enters NORMAL; Enter / s enters HISTORY from NORMAL.
# Ctrl-V enters MOVE in each mode (Ctrl-M is indistinguishable from Enter).
# Defaults remain enabled, including Ctrl-B [ and Ctrl-B E/e.
# HISTORY E/e opens the frozen history / captured command-output editor.
# During keyboard selection, default e still extends by word.
# HISTORY y copies the selection, match, or viewport and stays in HISTORY.
# HISTORY Y copies the last command output and returns to LOCKED; H opens Help.
# [keybinds.history] supports edit-history, edit-last-output, copy-last-output,
# and optional scroll-bottom / switch-mode steps. See history-view.md examples.
# Theme, session snapshots/history, notification filters and Manager keys are supported.
# This file uses Mocha and explicit Session Manager action keys.
# compact/default_mode and the session-wide floating terminal are supported.
# NORMAL i / PANE w toggles the same floating shell without restarting it.
# Named-session Manager: Ctrl-B Ctrl-W, or w in SESSION; j/k or arrows move,
# / searches, Tab completes, Enter attaches, a creates, dd kills, Esc cancels.

default_mode = "locked"
compact = false
clear_defaults = false
scrollback_lines = 5000
shell = "/opt/homebrew/bin/fish"
drag_source = true
drop_target = true

save_scrollback = true          # 保存历史
save_scrollback_colors = true   # 同时保存颜色和文字样式
autosave_interval_seconds = 30  # 每 30 秒自动保存；0 表示关闭

[theme]
preset = "mocha"

[notifications]
enabled = true
exclude_applications = ["yazi", "nvim", "lazygit"]
long_command_bell = true
command_duration_seconds = 10

[session_manager]
up = ["k", "up"]
down = ["j", "down"]
search = ["/"]
complete = ["tab"]
open = ["enter"]
rename = ["Ctrl r"]
save = ["Ctrl a"]
delete = ["d"]
disconnect = ["Ctrl x"]
cancel = ["esc"]
backspace = ["backspace"]

[keybinds.locked]
"Ctrl b" = { actions = [{ action = "switch-mode", mode = "normal" }], display = "always" }

[keybinds.normal]
esc      = { actions = [{ action="switch-mode", mode="locked" }],                      display = "help"   }
"Ctrl g" = { actions = [{ action="switch-mode", mode="locked" }],                      display = "help"   }
c        = { actions = ["new-window", { action="switch-mode", mode="locked" }],        display = "always" }
x        = { actions = ["close-window", { action="switch-mode", mode="locked" }],      display = "always" }
","      = { actions = ["rename-window"],                                              display = "always" }
n        = { actions = ["next-window", { action="switch-mode", mode="locked" }],       display = "always" }
p        = { actions = ["previous-window", { action="switch-mode", mode="locked" }],   display = "always" }
tab      = { actions = ["previous-window", { action="switch-mode", mode="locked" }],   display = "help"   }
"<"      = { actions = ["move-window-left", { action="switch-mode", mode="locked" }],  display = "help"   }
">"      = { actions = ["move-window-right", { action="switch-mode", mode="locked" }], display = "help"   }

1 = { actions = [{ action = "go-to-window", index = 1 }, { action = "switch-mode", mode = "locked" }], display = "hidden" }
2 = { actions = [{ action = "go-to-window", index = 2 }, { action = "switch-mode", mode = "locked" }], display = "hidden" }
