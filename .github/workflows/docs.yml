name: Deploy documentation

on:
  push:
    branches: [main, main-human]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'scripts/build-docs.sh'
      - 'scripts/build-docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-human'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: source-main
      - uses: actions/checkout@v6
        with:
          ref: main-human
          path: source-human
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build documentation
        env:
          # Keep local/Sites builds at / and adapt Pages builds to its base path.
          MDBOOK_OUTPUT__HTML__SITE_URL: '${{ steps.pages.outputs.base_path }}/'
        run: ./source-main/scripts/build-docs.sh --human-source ./source-human
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: source-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
