[book]
title = "Rustmux Documentation"
authors = ["Rustmux contributors"]
language = "en"
src = "docs"

[build]
build-dir = "dist"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Jacky-Lzx/Rustmux/tree/main"
edit-url-template = "https://github.com/Jacky-Lzx/Rustmux/edit/main/{path}"
site-url = "/"
no-section-label = true
